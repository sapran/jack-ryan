services:
  jackryan:
    build: .
    image: jackryan:latest
    container_name: jackryan
    ports:
      - "8500:8500"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      JACKRYAN_DATA_DIR: /data
    restart: unless-stopped

  # Ephemeral CLI. Runs on demand, never as a long-lived process:
  #   docker compose run --rm cli casefile list
  # It is scaled to zero on purpose — removing it breaks that workflow.
  cli:
    build: .
    image: jackryan:latest
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      JACKRYAN_DATA_DIR: /data
    entrypoint: ["jackryan"]
    deploy:
      replicas: 0
