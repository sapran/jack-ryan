name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual trigger. A run that fails to start cannot be retried through the
  # API — GitHub answers 403 "cannot be retried" — so without this the only
  # way to clear one is a fresh commit, which means inventing a change to push.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        # A venv, not --system: the runner's system Python is externally
        # managed and refuses installs into it.
        run: uv venv --python 3.12

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest -q
