name: gitleaks

# This repository is public: a secret committed here is world-readable and
# permanent. The scan runs on every push and pull request as the backstop.
on:
  push:
    branches: ["**"]
  pull_request:
  # Manual trigger. A run that fails to start cannot be retried through the
  # API — GitHub answers 403 "cannot be retried" — so without this the only
  # way to clear one is a fresh commit, which means inventing a change to push.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
