[project]
name = "jackryan"
version = "0.1.0"
description = "Jack Ryan — a self-hosted investigation workbench for an analyst working with an AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
jackryan = "jackryan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jackryan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
