[project]
name = "jackryan"
version = "0.1.0"
description = "Jack Ryan — a self-hosted investigation workbench for an analyst working with an AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Extraction engine. Heavy by design: its weight is the OCR and VLM
    # machinery that later milestones depend on.
    "docling>=2.0",
    # ONNX embeddings, so no torch runtime is needed to search.
    "fastembed>=0.4",
    # Vector search inside the same SQLite file that holds the text.
    "sqlite-vec>=0.1.6",
    # The agent-facing surface.
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
jackryan = "jackryan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jackryan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
