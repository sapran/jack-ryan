[project]
name = "jackryan"
version = "0.1.0"
description = "Jack Ryan — a self-hosted investigation workbench for an analyst working with an AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Extraction engine. Heavy by design: its weight is the OCR and VLM
    # machinery that later milestones depend on.
    # Pinned exactly, not loosely: what this produces becomes the chunks, so a
    # version move changes the corpus. It is deliberately not in the contract
    # fingerprint — see openspec/specs/layered-configuration — because the text
    # it changes is visible, unlike a change of embedding pooling.
    "docling==2.122.0",
    # ONNX embeddings, so no torch runtime is needed to search.
    # Pinned exactly and named in the corpus contract's fingerprint. 0.5.1 and
    # 0.8.0 embed the same model with different pooling, producing vectors of
    # the same width that are not comparable. A loose pin here is the one
    # dependency change that can corrupt a corpus with no error anywhere.
    "fastembed==0.8.0",
    # Vector search inside the same SQLite file that holds the text.
    "sqlite-vec>=0.1.6",
    # The agent-facing surface.
    "mcp>=2.0",
    # Spreadsheets. MIT.
    "openpyxl>=3.1",
    # Outlook .msg, the one mail format with no standard-library reader.
    # GPLv3, which AGPL-3.0's compatibility clause admits.
    "extract-msg>=0.54",
    # HTTP for the summarising seam. A pooled client rather than a hand-written
    # urllib call: one summary per chunk is roughly 36,000 requests for a corpus
    # the size of the one that exists, and without pooling that is 36,000 TCP and
    # TLS handshakes. httpx already arrives with a runtime install — both
    # huggingface-hub and docling depend on it — so this adds no package to
    # resolve and instead records that this code depends on it directly rather
    # than incidentally.
    "httpx>=0.28",
    # RAR archives, through the system libarchive. A ctypes binding rather than
    # a subprocess wrapper, because the expansion budget has to be able to
    # refuse an archive partway: every subprocess reader for this format either
    # extracts whole archives to a directory — which puts the full expansion on
    # disk before any ceiling applies — or derives from RARLAB's unRAR source,
    # which puts it in non-free. libarchive's RAR5 reader is an independent
    # BSD-2-clause implementation carrying none of that code, which is why it is
    # the one that ships in Debian main. The binding is CC0-1.0; neither it nor
    # the library disturbs this project's AGPL-3.0-or-later position.
    #
    # A ceiling as well as a floor, which no other loose pin in this file
    # carries. This is the one dependency that fronts a memory-unsafe C parser
    # reading untrusted input, and the version that decides whether that parser
    # is safe belongs to the system library rather than to this package — the
    # binding only reports it. `MIN_LIBARCHIVE` is enforced by reading
    # `libarchive.ffi.version_number`, so a major release that changed how the
    # library is located or how that number is spelled would disarm the floor
    # rather than fail against it, and the symptom would be a reader that says
    # it is fine. `<6` makes a new major a deliberate change with the floor
    # re-verified, while patch and minor releases — which is how a fix to the
    # binding itself would reach us — still resolve on their own.
    "libarchive-c>=5.3,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
jackryan = "jackryan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jackryan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
